services:
  mysql:
    image: mysql:8.0
    container_name: casa_trompo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-CasaTrompo2311*}
      MYSQL_DATABASE: ${DB_NAME:-casa_trompo_db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-CasaTrompo2311*}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - casa_trompo_net

  backend:
    image: node:22-alpine
    container_name: casa_trompo_api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.example
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-CasaTrompo2311*}
      DB_NAME: ${DB_NAME:-casa_trompo_db}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "if [ -f package.json ]; then npm install && npm start; else echo 'Esperando backend/package.json...' && tail -f /dev/null; fi"
    networks:
      - casa_trompo_net

  nginx:
    image: nginx:alpine
    container_name: casa_trompo_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - casa_trompo_net

volumes:
  mysql_data:

networks:
  casa_trompo_net:
    driver: bridge
