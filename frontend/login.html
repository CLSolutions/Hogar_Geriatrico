<!doctype html>
<html lang="es">
  <head>
    <!-- Metadatos de idioma, vista móvil, identidad visual y hojas de estilo. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · Casa Trompo</title>
    <meta
      name="description"
      content="Ingresa al portal de familias de Casa Trompo."
    />
    <meta name="theme-color" content="#FCEBDC" />
    <link rel="icon" type="image/png" href="img/Logo_Blanco_NOBG.png" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link rel="stylesheet" href="css/General_Styles.css" />
    <link rel="stylesheet" href="css/registro.css" />
    <link rel="stylesheet" href="css/login.css?v=7" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Enlace de acceso rápido para saltar directamente al inicio de sesión. -->
    <a class="skip-link" href="#contenido">Saltar al formulario</a>

    <!-- Diseño de acceso dividido: formulario a la izquierda e imagen a la derecha. -->
    <div class="auth-split">
      <main class="auth-form-wrap login-form-wrap" id="contenido">
        <div class="login-brand">
          <a
            class="brand"
            href="index.html"
            aria-label="Casa Trompo, volver al inicio"
          >
            <span class="logo-mark" aria-hidden="true"></span>
            <span class="brand__text">
              <span class="brand__kicker">Hogar geriátrico</span>
              <span class="brand__name">Casa Trompo</span>
            </span>
          </a>
          <a class="btn btn--outline btn--small" href="index.html"
            >Volver al inicio</a
          >
        </div>

        <div class="auth-form">
          <h1>Bienvenido de nuevo a casa</h1>
          <p class="lead">Ingresa al portal de familias.</p>

          <!-- El formulario es demostrativo y conserva los valores para facilitar pruebas. -->
          <form
            data-demo-form
            data-keep-values
            data-success="Ingreso de demostración: aquí se conectará el portal con el servidor."
          >
            <!-- Para conectarlo a tu servidor: agrega method="post" y action="tu-ruta" (PHP o Express) -->
            <div class="field">
              <label for="email">Correo electrónico</label>
              <input
                class="input"
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
              />
            </div>

            <div class="field">
              <label for="clave">Contraseña</label>
              <div class="password">
                <input
                  class="input"
                  id="clave"
                  name="clave"
                  type="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="password__toggle"
                  type="button"
                  data-toggle-password="clave"
                  aria-pressed="false"
                  aria-label="Mostrar contraseña"
                >
                  Mostrar
                </button>
              </div>
            </div>

            <div class="login-meta">
              <div class="check">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Recordar mis datos</label>
              </div>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn btn--primary btn--block" type="submit">
              Ingresar al portal
            </button>
            <p class="form-status" role="status" tabindex="-1" hidden></p>
          </form>

          <p class="auth-alt">
            ¿Aún no tienes cuenta?
            <a href="registro.html">Crea tu cuenta familiar</a>
          </p>
        </div>
      </main>

      <aside class="auth-visual">
        <img
          src="img/hero-escena.jpg"
          width="1044"
          height="980"
          alt="Una pareja de abuelos abrazados mirando el atardecer en el campo, con un trompo, un carrito y una muñeca a su lado"
        />
        <div class="auth-visual__text">
          <p class="script">Qué alegría tenerte de vuelta</p>
          <p>Inicia sesión para estar cerca de quienes más quieres.</p>
        </div>
      </aside>
    </div>

    <!-- Comportamientos compartidos: accesibilidad, recordar correo y validación. -->
    <script src="js/main.js"></script>
  </body>
</html>
